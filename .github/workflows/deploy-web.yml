name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        env:
          AD_PUBLISHER_ID: ${{ secrets.AD_PUBLISHER_ID }}
          AD_TEST_MODE: ${{ vars.AD_TEST_MODE }}
          ADMOB_REWARDED_SLOT: ${{ secrets.ADMOB_REWARDED_SLOT }}
          ADMOB_INTERSTITIAL_SLOT: ${{ secrets.ADMOB_INTERSTITIAL_SLOT }}
        run: |
          DARGS=""
          if [ -n "$AD_PUBLISHER_ID" ]; then
            DARGS="$DARGS --dart-define=AD_PUBLISHER_ID=$AD_PUBLISHER_ID"
          fi
          if [ -n "$AD_TEST_MODE" ]; then
            DARGS="$DARGS --dart-define=AD_TEST_MODE=$AD_TEST_MODE"
          else
            DARGS="$DARGS --dart-define=AD_TEST_MODE=true"
          fi
          if [ -n "$ADMOB_REWARDED_SLOT" ]; then
            DARGS="$DARGS --dart-define=ADMOB_REWARDED_SLOT=$ADMOB_REWARDED_SLOT"
          fi
          if [ -n "$ADMOB_INTERSTITIAL_SLOT" ]; then
            DARGS="$DARGS --dart-define=ADMOB_INTERSTITIAL_SLOT=$ADMOB_INTERSTITIAL_SLOT"
          fi
          flutter build web --release --wasm --base-href="/${{ github.event.repository.name }}/" $DARGS

      - name: Verify boot shell in built index
        run: grep -q 'data-shell' build/web/index.html && grep -q 'Chrome 앱에서 열기' build/web/index.html

      - name: SPA fallback for GitHub Pages
        run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
