name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      ad_test_mode:
        description: 'AD_TEST_MODE override (empty = use repo variable or default)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 'true'
          - 'false'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        env:
          AD_PUBLISHER_ID: ${{ secrets.AD_PUBLISHER_ID }}
          AD_TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.ad_test_mode != '' && inputs.ad_test_mode || vars.AD_TEST_MODE }}
          ADMOB_REWARDED_SLOT: ${{ secrets.ADMOB_REWARDED_SLOT }}
          ADMOB_INTERSTITIAL_SLOT: ${{ secrets.ADMOB_INTERSTITIAL_SLOT }}
        run: |
          DARGS=""
          if [ -n "$AD_PUBLISHER_ID" ]; then
            DARGS="$DARGS --dart-define=AD_PUBLISHER_ID=$AD_PUBLISHER_ID"
            if [ -n "$AD_TEST_MODE" ]; then
              DARGS="$DARGS --dart-define=AD_TEST_MODE=$AD_TEST_MODE"
            else
              DARGS="$DARGS --dart-define=AD_TEST_MODE=true"
            fi
          else
            DARGS="$DARGS --dart-define=AD_TEST_MODE=true"
          fi
          if [ -n "$ADMOB_REWARDED_SLOT" ]; then
            DARGS="$DARGS --dart-define=ADMOB_REWARDED_SLOT=$ADMOB_REWARDED_SLOT"
          fi
          if [ -n "$ADMOB_INTERSTITIAL_SLOT" ]; then
            DARGS="$DARGS --dart-define=ADMOB_INTERSTITIAL_SLOT=$ADMOB_INTERSTITIAL_SLOT"
          fi
          flutter build web --release --wasm --base-href="/${{ github.event.repository.name }}/" $DARGS

      - name: Generate ads.txt for AdSense
        if: env.AD_PUBLISHER_ID != ''
        env:
          AD_PUBLISHER_ID: ${{ secrets.AD_PUBLISHER_ID }}
        run: |
          PUB="${AD_PUBLISHER_ID#ca-pub-}"
          PUB="${PUB#pub-}"
          echo "google.com, pub-${PUB}, DIRECT, f08c47fec0942fa0" > build/web/ads.txt
          echo "Generated ads.txt:"
          cat build/web/ads.txt

      - name: Verify boot shell in built index
        run: grep -q 'data-shell' build/web/index.html && grep -q 'Chrome 앱에서 열기' build/web/index.html

      - name: Verify ads.txt when publisher configured
        if: secrets.AD_PUBLISHER_ID != ''
        run: test -f build/web/ads.txt && grep -q 'google.com, pub-' build/web/ads.txt

      - name: SPA fallback for GitHub Pages
        run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
