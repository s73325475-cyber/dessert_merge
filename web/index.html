<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="디저트를 쏴서 합치는 물리 기반 빌리어드 머지 게임. 모바일 세로 화면에 최적화.">
  <meta name="theme-color" content="#3d2a5c">

  <meta property="og:type" content="website">
  <meta property="og:title" content="디저트 빌리어드 머지">
  <meta property="og:description" content="디저트를 쏴서 합치는 물리 기반 빌리어드 머지 게임. 모바일 세로 화면 최적화.">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:image" content="https://s73325475-cyber.github.io/dessert_merge/og-thumbnail.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="675">
  <meta property="og:url" content="https://s73325475-cyber.github.io/dessert_merge/?mode=arcade&from=blog">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="디저트 빌리어드 머지">
  <meta name="twitter:description" content="디저트를 쏴서 합치는 물리 기반 빌리어드 머지 게임">
  <meta name="twitter:image" content="https://s73325475-cyber.github.io/dessert_merge/og-thumbnail.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="디저트 머지">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>디저트 빌리어드 머지</title>
  <link rel="manifest" href="manifest.json">

  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var params = new URLSearchParams(location.search);
      var fromBlog = params.get('from') === 'blog' || params.get('from') === 'naver';
      var refNaver = /naver\.com/i.test(document.referrer || '');
      var mobile = window.innerWidth <= 820 ||
        /Android|iPhone|iPad|iPod|Mobile|SamsungBrowser/i.test(ua);
      var android = /Android/i.test(ua);
      var inAppUa = /NAVER|KAKAOTALK|Instagram|Line\//i.test(ua);
      var webView = /;\s*wv\)/.test(ua);
      var androidChrome = android && !webView && !inAppUa &&
        /Chrome\/[\d.]+ Mobile Safari\/[\d.]+/i.test(ua);
      var iosSafari = /iPhone|iPad|iPod/i.test(ua) &&
        /Safari/i.test(ua) && !inAppUa;

      var shell = 'desktop';
      if (!mobile) {
        shell = 'desktop';
      } else if (fromBlog || refNaver || inAppUa || webView ||
          (android && !androidChrome) || (mobile && !iosSafari && !androidChrome)) {
        shell = 'inapp';
      } else {
        shell = 'start';
      }
      document.documentElement.dataset.shell = shell;
    })();
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: #120a1c;
      color: #fff;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
    #start-screen, #inapp-screen, #boot-loader, #error-screen {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 100000;
      background: linear-gradient(180deg, #3d2a5c 0%, #1a1028 100%);
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    html[data-shell="start"] #start-screen,
    html[data-shell="inapp"] #inapp-screen,
    html[data-shell="desktop"] #boot-loader { display: flex; }
    html[data-shell="loading"] #boot-loader { display: flex; }
    html[data-shell="error"] #error-screen { display: flex; }
    #boot-loader { z-index: 9999; }
    #boot-loader.hidden { opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
    .screen-emoji { font-size: 72px; line-height: 1; }
    .screen-title { font-size: 22px; font-weight: 800; margin: 0; }
    .screen-sub { font-size: 14px; opacity: 0.7; margin: 0; line-height: 1.5; max-width: 340px; }
    .screen-badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 13px;
      color: #9ad0ec;
    }
    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: min(100%, 320px);
    }
    .btn-primary, .btn-secondary {
      width: 100%;
      padding: 16px 20px;
      border: 0;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    .btn-primary {
      background: linear-gradient(180deg, #f5c842 0%, #f5b945 100%);
      color: #2c1f43;
      box-shadow: 0 4px 16px rgba(245,185,69,0.35);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
    }
    #copy-toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(20, 20, 20, 0.92);
      color: #fff;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 200000;
    }
    #copy-toast.show { opacity: 1; }
    .link-field {
      display: none;
      width: min(100%, 320px);
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(154, 208, 236, 0.35);
      background: rgba(0,0,0,0.35);
      color: #9ad0ec;
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
      word-break: break-all;
      box-sizing: border-box;
      -webkit-user-select: all;
      user-select: all;
    }
    .link-field.show { display: block; }
    .link-hint {
      display: none;
      font-size: 12px;
      opacity: 0.75;
      line-height: 1.5;
      max-width: 320px;
      margin: 0;
    }
    .link-hint.show { display: block; }
    #boot-loader .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #f5b945;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="start-screen">
    <div class="screen-emoji" aria-hidden="true">🍰</div>
    <h1 class="screen-title">디저트 빌리어드 머지</h1>
    <p class="screen-sub">디저트를 쏴서 합치는<br>물리 빌리어드 머지 게임</p>
    <div class="screen-badge" id="mode-badge">아케이드 모드</div>
    <button id="start-btn" class="btn-primary" type="button">▶  탭하여 시작</button>
  </div>

  <div id="inapp-screen">
    <div class="btn-row">
      <button id="open-browser-btn" class="btn-primary" type="button">🌐  Chrome 앱에서 열기</button>
      <button id="copy-link-btn" class="btn-secondary" type="button">📋  링크 복사</button>
    </div>
    <input id="link-field" class="link-field" readonly aria-label="게임 주소">
    <p id="link-hint" class="link-hint">아래 주소를 길게 눌러 복사한 뒤 Chrome 주소창에 붙여넣으세요</p>
  </div>

  <div id="boot-loader" aria-live="polite" aria-busy="true">
    <div class="screen-emoji" aria-hidden="true">🍰</div>
    <div class="screen-title">디저트 빌리어드 머지</div>
    <div class="spinner" aria-hidden="true"></div>
    <p class="screen-sub" id="boot-hint">게임을 불러오는 중…</p>
  </div>

  <div id="error-screen" role="alert">
    <div class="btn-row">
      <button id="open-browser-btn-error" class="btn-primary" type="button">🌐  Chrome 앱에서 열기</button>
      <button id="error-copy-btn" class="btn-secondary" type="button">📋  링크 복사</button>
    </div>
  </div>

  <div id="copy-toast" aria-live="polite">링크가 복사되었어요!</div>

  <script>
    (function () {
      var BUILD = '20260809c';
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) { reg.unregister(); });
        });
      }

      var root = document.documentElement;
      var flutterStarted = false;
      var bootLoader = document.getElementById('boot-loader');
      var bootHint = document.getElementById('boot-hint');
      var copyToast = document.getElementById('copy-toast');
      var loadTimeoutId = null;

      var params = new URLSearchParams(location.search);
      var mode = (params.get('mode') || params.get('play') || 'arcade').toLowerCase();
      var modeBadge = document.getElementById('mode-badge');
      if (modeBadge) {
        modeBadge.textContent = mode === 'campaign' ? '캠페인 모드'
          : mode === 'menu' ? '메인 메뉴' : '아케이드 모드';
      }

      function setShell(name) {
        root.dataset.shell = name;
      }

      function gameUrl() {
        var url = new URL(location.href);
        url.searchParams.set('mode', mode === 'menu' || mode === 'campaign' ? mode : 'arcade');
        url.searchParams.set('gate', '0');
        url.searchParams.set('fresh', '1');
        url.searchParams.delete('from');
        url.searchParams.delete('resume');
        return url.toString();
      }

      function revealLinkField() {
        var field = document.getElementById('link-field');
        var hint = document.getElementById('link-hint');
        var link = gameUrl();
        if (field) {
          field.value = link;
          field.classList.add('show');
          field.focus();
          field.select();
          try {
            field.setSelectionRange(0, link.length);
          } catch (e) {}
        }
        if (hint) hint.classList.add('show');
        return field;
      }

      function isInAppShell() {
        return root.dataset.shell === 'inapp';
      }

      function hasWebGL() {
        try {
          var c = document.createElement('canvas');
          return !!(c.getContext('webgl2') || c.getContext('webgl') ||
            c.getContext('experimental-webgl'));
        } catch (e) {
          return false;
        }
      }

      function showToast(message) {
        if (!copyToast) return;
        copyToast.textContent = message;
        copyToast.classList.add('show');
        setTimeout(function () { copyToast.classList.remove('show'); }, 2200);
      }

      function copyGameLink() {
        var link = gameUrl();
        var field = revealLinkField();
        function done(ok) {
          showToast(ok
            ? '복사됐어요! Chrome 주소창에 붙여넣기'
            : '아래 주소를 길게 눌러 복사하세요');
        }
        function fallbackCopy() {
          if (field) {
            field.focus();
            field.select();
            try {
              done(document.execCommand('copy'));
              return;
            } catch (e) {}
          }
          var ta = document.createElement('textarea');
          ta.value = link;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.left = '0';
          ta.style.width = '2em';
          ta.style.height = '2em';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          try {
            done(document.execCommand('copy'));
          } catch (e) {
            done(false);
          }
          document.body.removeChild(ta);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(link)
            .then(function () { done(true); })
            .catch(fallbackCopy);
        } else {
          fallbackCopy();
        }
      }

      function tryOpenExternalBrowser() {
        var link = gameUrl();
        if (/Android/i.test(navigator.userAgent)) {
          var stripped = link.replace(/^https?:\/\//, '');
          window.location.href =
            'intent://' + stripped +
            '#Intent;scheme=https;action=android.intent.action.VIEW;' +
            'package=com.android.chrome;S.browser_fallback_url=' +
            encodeURIComponent(link) + ';end';
          return;
        }
        copyGameLink();
      }

      function markGateReady() {
        var url = new URL(location.href);
        url.searchParams.set('gate', '0');
        history.replaceState(null, '', url.toString());
        window.__dessertUserGesture = true;
      }

      function showError() {
        if (loadTimeoutId) clearTimeout(loadTimeoutId);
        setShell('error');
      }

      function scheduleLoadTimeout() {
        if (loadTimeoutId) clearTimeout(loadTimeoutId);
        loadTimeoutId = setTimeout(showError, 90000);
      }

      function startFlutter() {
        if (flutterStarted) return;
        if (isInAppShell()) return;
        if (!hasWebGL()) {
          showError();
          return;
        }

        flutterStarted = true;
        markGateReady();
        setShell('loading');
        scheduleLoadTimeout();

        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js?v=' + BUILD;
        s.async = true;
        s.onerror = showError;
        document.body.appendChild(s);
      }

      window.addEventListener('flutter-first-frame', function () {
        if (loadTimeoutId) clearTimeout(loadTimeoutId);
        if (!bootLoader) return;
        bootLoader.classList.add('hidden');
        setTimeout(function () { bootLoader.remove(); setShell('game'); }, 400);
      });

      window.addEventListener('error', function (ev) {
        if (!flutterStarted || root.dataset.shell !== 'loading') return;
        var msg = (ev && ev.message) ? String(ev.message) : '';
        if (/wasm|webgl|canvaskit|skwasm|flutter/i.test(msg)) showError();
      });

      setTimeout(function () {
        if (bootHint && root.dataset.shell === 'loading') {
          bootHint.textContent = '최초 로딩은 10~30초 걸릴 수 있어요…';
        }
      }, 10000);

      function bindTap(el, fn) {
        if (!el) return;
        var lastTap = 0;
        function run(e) {
          if (e.type === 'click' && Date.now() - lastTap < 500) return;
          lastTap = Date.now();
          if (e.cancelable) e.preventDefault();
          fn();
        }
        el.addEventListener('touchstart', run, { passive: false });
        el.addEventListener('click', run);
      }

      bindTap(document.getElementById('start-btn'), startFlutter);
      bindTap(document.getElementById('copy-link-btn'), copyGameLink);
      bindTap(document.getElementById('open-browser-btn'), tryOpenExternalBrowser);
      bindTap(document.getElementById('error-copy-btn'), copyGameLink);
      bindTap(document.getElementById('open-browser-btn-error'), tryOpenExternalBrowser);

      if (root.dataset.shell === 'desktop') {
        startFlutter();
      }
    })();
  </script>
</body>
</html>
