  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>디저트 빌리어드 머지</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background: #120a1c;
      color: #fff;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 9999;
      background: linear-gradient(180deg, #3d2a5c 0%, #1a1028 100%);
      transition: opacity 0.35s ease;
    }
    #boot-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #boot-loader .emoji { font-size: 64px; }
    #boot-loader .title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    #boot-loader .hint {
      font-size: 13px;
      opacity: 0.65;
      text-align: center;
      padding: 0 24px;
      line-height: 1.5;
    }
    #boot-loader .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #f5b945;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot-loader" aria-live="polite" aria-busy="true">
    <div class="emoji" aria-hidden="true">🍰</div>
    <div class="title">디저트 빌리어드 머지</div>
    <div class="spinner" aria-hidden="true"></div>
    <div class="hint" id="boot-hint">게임을 불러오는 중…</div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) { reg.unregister(); });
      });
    }

    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('boot-loader');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(function () { loader.remove(); }, 400);
      }
    });

    setTimeout(function () {
      var hint = document.getElementById('boot-hint');
      var loader = document.getElementById('boot-loader');
      if (hint && loader && !loader.classList.contains('hidden')) {
        hint.textContent = '최초 로딩은 10~30초 걸릴 수 있어요…';
      }
    }, 10000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
