<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="twitter:description" content="디저트를 쏴서 합치는 물리 기반 빌리어드 머지 게임">
  <meta name="twitter:image" content="https://s73325475-cyber.github.io/dessert_merge/og-thumbnail.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>디저트 빌리어드 머지</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: #120a1c;
      color: #fff;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
    #start-screen, #boot-loader, #error-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 100000;
      background: linear-gradient(180deg, #3d2a5c 0%, #1a1028 100%);
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    #boot-loader, #error-screen { display: none; }
    #boot-loader { z-index: 9999; }
    #boot-loader.hidden, #error-screen.hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .screen-emoji { font-size: 72px; line-height: 1; }
    .screen-title { font-size: 22px; font-weight: 800; margin: 0; }
    .screen-sub { font-size: 14px; opacity: 0.7; margin: 0; line-height: 1.5; max-width: 340px; }
    .screen-badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 13px;
      color: #9ad0ec;
    }
    #inapp-warn {
      display: none;
      width: min(100%, 340px);
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255, 93, 93, 0.16);
      border: 1px solid rgba(255, 143, 143, 0.35);
      color: #ffd6d6;
      font-size: 13px;
      line-height: 1.55;
      text-align: left;
    }
    #start-btn, #retry-btn {
      margin-top: 8px;
      width: min(100%, 320px);
      padding: 18px 24px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(180deg, #f5c842 0%, #f5b945 100%);
      color: #2c1f43;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(245,185,69,0.35);
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    #boot-loader .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #f5b945;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- 모바일: Flutter 로드 전 순수 HTML 시작 화면 -->
  <div id="start-screen">
    <div class="screen-emoji" aria-hidden="true">🍰</div>
    <h1 class="screen-title">디저트 빌리어드 머지</h1>
    <p class="screen-sub">디저트를 쏴서 합치는<br>물리 빌리어드 머지 게임</p>
    <div class="screen-badge" id="mode-badge">아케이드 모드</div>
    <div id="inapp-warn">
      <strong>앱 내 브라우저</strong>에서는 실행이 안 될 수 있어요.<br>
      우측 상단 <strong>···</strong> 메뉴 → <strong>Safari</strong> 또는 <strong>Chrome</strong>으로 열어 주세요.
    </div>
    <button id="start-btn" type="button">▶  탭하여 시작</button>
    <p class="screen-sub">세로 화면 · Wi-Fi/데이터 환경 권장<br>최초 실행 시 10~30초 걸릴 수 있어요</p>
  </div>

  <div id="boot-loader" aria-live="polite" aria-busy="true">
    <div class="screen-emoji" aria-hidden="true">🍰</div>
    <div class="screen-title">디저트 빌리어드 머지</div>
    <div class="spinner" aria-hidden="true"></div>
    <p class="screen-sub" id="boot-hint">게임을 불러오는 중…</p>
  </div>

  <div id="error-screen" role="alert">
    <div class="screen-emoji" aria-hidden="true">⚠️</div>
    <div class="screen-title">불러오기 실패</div>
    <p class="screen-sub" id="error-msg">네트워크 또는 브라우저 호환 문제일 수 있어요.</p>
    <button id="retry-btn" type="button">다시 시도</button>
  </div>

  <script>
    (function () {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) { reg.unregister(); });
        });
      }

      var flutterStarted = false;
      var startScreen = document.getElementById('start-screen');
      var bootLoader = document.getElementById('boot-loader');
      var errorScreen = document.getElementById('error-screen');
      var errorMsg = document.getElementById('error-msg');
      var modeBadge = document.getElementById('mode-badge');
      var bootHint = document.getElementById('boot-hint');
      var inappWarn = document.getElementById('inapp-warn');
      var loadTimeoutId = null;

      var params = new URLSearchParams(location.search);
      var mode = (params.get('mode') || params.get('play') || 'arcade').toLowerCase();
      if (modeBadge) {
        modeBadge.textContent = mode === 'campaign' ? '캠페인 모드'
          : mode === 'menu' ? '메인 메뉴' : '아케이드 모드';
      }

      function isMobileLike() {
        return window.innerWidth <= 820 ||
          /Android|iPhone|iPad|iPod|Mobile|SamsungBrowser/i.test(navigator.userAgent);
      }

      function isInAppBrowser() {
        var ua = navigator.userAgent || '';
        return /NAVER/i.test(ua) ||
          /KAKAOTALK/i.test(ua) ||
          /Instagram/i.test(ua) ||
          /Line\//i.test(ua) ||
          /FBAN|FBAV/i.test(ua) ||
          (/iPhone|iPad|iPod/i.test(ua) && !/Safari/i.test(ua));
      }

      function hasWebGL() {
        try {
          var c = document.createElement('canvas');
          return !!(c.getContext('webgl2') || c.getContext('webgl') ||
            c.getContext('experimental-webgl'));
        } catch (e) {
          return false;
        }
      }

      function markGateReady() {
        var url = new URL(location.href);
        url.searchParams.set('gate', '0');
        history.replaceState(null, '', url.toString());
        window.__dessertUserGesture = true;
      }

      function hideAllScreens() {
        if (startScreen) startScreen.style.display = 'none';
        if (bootLoader) bootLoader.style.display = 'none';
        if (errorScreen) errorScreen.style.display = 'none';
      }

      function showError(message) {
        if (loadTimeoutId) clearTimeout(loadTimeoutId);
        hideAllScreens();
        if (errorMsg) errorMsg.textContent = message;
        if (errorScreen) errorScreen.style.display = 'flex';
      }

      function scheduleLoadTimeout() {
        if (loadTimeoutId) clearTimeout(loadTimeoutId);
        loadTimeoutId = setTimeout(function () {
          showError(
            '로딩 시간이 너무 길어요. Wi-Fi/데이터 연결을 확인하거나, ' +
            'Safari·Chrome 등 외부 브라우저에서 다시 열어 주세요.'
          );
        }, 90000);
      }

      function startFlutter() {
        if (flutterStarted) return;

        if (!hasWebGL()) {
          showError('이 기기/브라우저는 WebGL(게임 그래픽)을 지원하지 않아요. Safari 또는 Chrome에서 열어 주세요.');
          return;
        }

        flutterStarted = true;
        markGateReady();
        hideAllScreens();
        if (bootLoader) {
          bootLoader.style.display = 'flex';
          bootLoader.classList.remove('hidden');
        }
        scheduleLoadTimeout();

        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = true;
        s.onerror = function () {
          showError('게임 파일을 불러오지 못했어요. 네트워크 연결 후 다시 시도해 주세요.');
        };
        document.body.appendChild(s);
      }

      window.addEventListener('flutter-first-frame', function () {
        if (loadTimeoutId) clearTimeout(loadTimeoutId);
        if (!bootLoader) return;
        bootLoader.classList.add('hidden');
        setTimeout(function () { bootLoader.remove(); }, 400);
      });

      window.addEventListener('error', function (ev) {
        if (!flutterStarted || !bootLoader || bootLoader.style.display === 'none') return;
        var msg = (ev && ev.message) ? String(ev.message) : '';
        if (/wasm|webgl|canvaskit|skwasm|flutter/i.test(msg)) {
          showError('그래픽 엔진 로딩에 실패했어요. Safari·Chrome에서 열거나 페이지를 새로고침해 주세요.');
        }
      });

      setTimeout(function () {
        if (bootHint && bootLoader && bootLoader.style.display !== 'none' &&
            !bootLoader.classList.contains('hidden')) {
          bootHint.textContent = '최초 로딩은 10~30초 걸릴 수 있어요…';
        }
      }, 10000);

      function onStartTap(e) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        startFlutter();
      }

      var startBtn = document.getElementById('start-btn');
      if (startBtn) {
        startBtn.addEventListener('touchstart', onStartTap, { passive: false });
        startBtn.addEventListener('click', onStartTap);
      }
      if (startScreen) {
        startScreen.addEventListener('touchstart', function (e) {
          if (e.target === startBtn) return;
          onStartTap(e);
        }, { passive: false });
      }

      var retryBtn = document.getElementById('retry-btn');
      if (retryBtn) {
        retryBtn.addEventListener('click', function () {
          flutterStarted = false;
          location.reload();
        });
      }

      if (inappWarn && isInAppBrowser()) {
        inappWarn.style.display = 'block';
      }

      // PC·태블릿 가로: 바로 로드 / 모바일: 시작 버튼 필요
      if (!isMobileLike()) {
        startFlutter();
      }
    })();
  </script>
</body>
</html>
